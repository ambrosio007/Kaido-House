<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/cadastro.css">
    <title>Cadastre-se</title>
</head>
<body>
    <div class="container">
        <form action="/cadastro-user" method="post">
            <fieldset>
                <legend><b>Cadastro</b></legend>
                <div class="inputBox">
                    <input type="text" name="nome" id="nomeID" class="inputUser" required>
                    <label for="nomeID" class="labelInput">Nome completo</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="text" name="cpf" id="cpfID" class="inputUser" required minlength="11" maxlength="14">
                    <label for="cpfID" class="labelInput">CPF</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="text" name="cep" id="cepID" class="inputUser" required minlength="8" maxlength="9">
                    <label for="cepID" class="labelInput">CEP</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <label for="dateID" class="labelInput"><b>Data de Nascimento</b></label>
                    <input type="date" name="date" id="dateID" class="inputUser" required>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="email" name="email" id="emailID" class="inputUser" required>
                    <label for="emailID" class="labelInput">Email</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="password" name="senha" id="senhaID" class="inputUser" required minlength="8">
                    <label for="senhaID" class="labelInput">Senha</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="password" name="confirma_senha" id="confirma_senhaID" class="inputUser" required minlength="8">
                    <label for="confirma_senhaID" class="labelInput">Confirme a senha</label>
                </div>
                <br><br>
                <input type="submit" id="submit" value="Cadastrar">
                <a onclick="window.location.href='/login'">Login</a>
            </fieldset>
        </form>
    </div>

    <script>
        // Validação de senha
        document.querySelector('form').addEventListener('submit', function(e) {
            const senha = document.getElementById('senhaID').value;
            const confirmaSenha = document.getElementById('confirma_senhaID').value;
            
            if (senha !== confirmaSenha) {
                e.preventDefault();
                alert('As senhas não coincidem!');
            }
        });

        // Máscara CPF
        document.getElementById('cpfID').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            }
        });

        // Máscara CEP
        document.getElementById('cepID').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 8) {
                value = value.replace(/(\d{5})(\d)/, '$1-$2');
                e.target.value = value;
            }
        });
    </script>
</body>
</html>
