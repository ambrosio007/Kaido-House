<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/cadastro.css">
    <title>Cadastre-se</title>
</head>

<body>
    <div class="container">
        <form id="formCadastro">
            <fieldset>
                <legend><b>Cadastro</b></legend>
                <div class="inputBox">
                    <input type="text" name="nome" id="nomeID" class="inputUser" required>
                    <label for="nomeID" class="labelInput">Nome completo</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="text" name="cpf" id="cpfID" class="inputUser" required minlength="11" maxlength="14">
                    <label for="cpfID" class="labelInput">CPF</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="text" name="cep" id="cepID" class="inputUser" required minlength="8" maxlength="9">
                    <label for="cepID" class="labelInput">CEP</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <label for="idadeID" class="labelInput"><b>Data de Nascimento</b></label>
                    <input type="date" name="idade" id="idadeID" class="inputUser" required max="">
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="email" name="email" id="emailID" class="inputUser" required>
                    <label for="emailID" class="labelInput">Email</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="password" name="senha" id="senhaID" class="inputUser" required minlength="8">
                    <label for="senhaID" class="labelInput">Senha</label>
                </div>
                <br><br>
                <div class="inputBox">
                    <input type="password" name="confirma_senha" id="confirma_senhaID" class="inputUser" required
                        minlength="8">
                    <label for="confirma_senhaID" class="labelInput">Confirme a senha</label>
                </div>
                <br><br>
                <input type="submit" id="submit" value="Cadastrar">
                <a href="/login">Já tem conta? Login</a>
            </fieldset>
        </form>
    </div>

    <script>
        // Define data máxima (hoje) para o campo de data de nascimento
        document.addEventListener('DOMContentLoaded', function() {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('idadeID').setAttribute('max', hoje);
        });

        // Envio do formulário
        document.getElementById('formCadastro').addEventListener('submit', async function (e) {
            e.preventDefault();

            const senha = document.getElementById('senhaID').value;
            const confirmaSenha = document.getElementById('confirma_senhaID').value;
            const dataNascimento = document.getElementById('idadeID').value;

            // Validação de senha
            if (senha !== confirmaSenha) {
                alert('As senhas não coincidem!');
                return;
            }

            // Validação de data
            if (!dataNascimento || dataNascimento === '') {
                alert('Por favor, informe uma data de nascimento válida!');
                return;
            }

            // Verifica se a data não é futura
            const dataAtual = new Date();
            const dataSelecionada = new Date(dataNascimento);
            
            if (dataSelecionada > dataAtual) {
                alert('A data de nascimento não pode ser no futuro!');
                return;
            }

            // Verifica se a pessoa tem pelo menos 16 anos
            const idade = Math.floor((dataAtual - dataSelecionada) / (365.25 * 24 * 60 * 60 * 1000));
            if (idade < 16) {
                alert('Você deve ter pelo menos 16 anos para se cadastrar!');
                return;
            }

            // Pega os dados do formulário
            const formData = new FormData(this);
            
            // Remove o campo confirma_senha antes de enviar
            formData.delete('confirma_senha');

            try {
                const response = await fetch('/cadastro-user', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    window.location.href = '/login';
                } else {
                    alert('Erro ao cadastrar: ' + data.error);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão com o servidor.');
            }
        });

        // --- Máscaras ---

        // Máscara CPF
        document.getElementById('cpfID').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            }
        });

        // Máscara CEP
        document.getElementById('cepID').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 8) {
                value = value.replace(/(\d{5})(\d)/, '$1-$2');
                e.target.value = value;
            }
        });
    </script>
</body>

</html>
