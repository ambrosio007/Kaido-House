<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/login.css">
    <title>Login | Kaido-House</title>
</head>

<body>
    <div class="container">
        <form id="loginForm">
            <fieldset>
                <legend><b>Login</b></legend>
                <br>
                <div class="inputBox">
                    <input type="email" name="email" id="emailID" class="inputUser" required>
                    <label for="emailID" class="labelInput">Email</label>
                </div>
                <br>
                <div class="inputBox">
                    <input type="password" name="senha" id="senhaID" class="inputUser" required>
                    <label for="senhaID" class="labelInput">Senha</label>
                </div>
                <br><br>
                <input type="submit" value="Login" id="submit">
                <br><br>
                <a class="link" href="/cadastro">Cadastre-se</a>
                <br><br>
                <a class="link" href="/recuperar_senha">Esqueci a senha</a>
            </fieldset>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('emailID').value;
            const senha = document.getElementById('senhaID').value;

            console.log('🔐 Tentando fazer login...', { email });

            try {
                const response = await fetch('/login-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, senha: senha })
                });

                console.log('📊 Status da resposta:', response.status);

                const data = await response.json();
                console.log('📦 Dados recebidos:', data);

                if (response.ok) {
                    // ✅ CORREÇÃO CRÍTICA: Salvar com o nome correto
                    if (data.access_token) {
                        // 1. Salvar token com AMBOS os nomes para compatibilidade
                        localStorage.setItem('access_token', data.access_token);
                        localStorage.setItem('token', data.access_token); // Fallback
                        console.log('✅ Token salvo com sucesso!');

                        // 2. Salvar dados do usuário
                        if (data.user) {
                            localStorage.setItem('user_name', data.user.nome);
                            localStorage.setItem('user_id', data.user.id);
                            localStorage.setItem('user_email', data.user.email);
                            console.log('✅ Dados do usuário salvos!');
                        }

                        // 3. Verificar se há redirect na URL
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirect = urlParams.get('redirect') || '/';

                        console.log('🚀 Redirecionando para:', redirect);

                        // 4. Pequeno delay para garantir que o localStorage foi salvo
                        setTimeout(() => {
                            window.location.href = redirect;
                        }, 100);

                    } else {
                        console.error('❌ Token não encontrado na resposta!');
                        alert('Erro: Token de autenticação não recebido');
                    }
                } else {
                    console.error('❌ Erro no login:', data);
                    alert('Erro no login: ' + (data.error || 'Verifique seus dados'));
                }

            } catch (error) {
                console.error('❌ Erro de conexão:', error);
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>
</body>

</html>
