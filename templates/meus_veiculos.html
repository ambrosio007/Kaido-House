<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Meus Veículos | Kaido-House</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 80px auto 40px;
            padding: 20px;
        }

        .page-header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            color: #333;
            font-size: 32px;
        }

        .page-header h1 i {
            color: #667eea;
            margin-right: 15px;
        }

        .btn-back {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .veiculos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .veiculo-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .veiculo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .veiculo-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 64px;
        }

        .veiculo-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .veiculo-info {
            padding: 20px;
        }

        .veiculo-info h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .veiculo-details {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .veiculo-details p {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .veiculo-details i {
            color: #667eea;
            width: 20px;
        }

        .veiculo-price {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 15px;
        }

        .veiculo-estado {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .estado-novo {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .estado-seminovo {
            background: #fff3e0;
            color: #ef6c00;
        }

        .estado-usado {
            background: #e3f2fd;
            color: #1565c0;
        }

        .veiculo-actions {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .veiculo-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-edit {
            background: #4CAF50;
            color: white;
        }

        .btn-edit:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .empty-state {
            background: white;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .empty-state i {
            font-size: 80px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #666;
            margin-bottom: 15px;
        }

        .empty-state p {
            color: #999;
            margin-bottom: 25px;
        }

        .btn-cadastrar {
            background: #667eea;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-cadastrar:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .loading {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .loading i {
            font-size: 48px;
            color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 20px;
            color: #666;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .veiculos-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                gap: 20px;
            }

            .page-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="/" class="logo">
            <img src="/static/img/logo-removebg-preview.png" alt="Logo Kaido-House" class="logo-img">
        </a>

        <nav class="navbar">
            <a href="/">Início</a>
            <a href="/perfil">Meu Perfil</a>
            <a href="/pecas_pag">Peças</a>
            <a href="/veiculos_pag">Veículos</a>
        </nav>

        <div class="header-icons">
            <i id="menu-btn" class="fas fa-bars"></i>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-car"></i> Meus Veículos</h1>
            <a href="/perfil" class="btn-back">
                <i class="fas fa-arrow-left"></i> Voltar ao Perfil
            </a>
        </div>

        <div id="listaVeiculos" class="veiculos-grid">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Carregando seus veículos...</p>
            </div>
        </div>
    </div>

    <script>
        // ✅ CORREÇÃO: Ordem consistente de verificação do token
        async function carregarVeiculos() {
            // ✅ IMPORTANTE: Buscar access_token PRIMEIRO (mesmo nome que o backend retorna)
            const token = localStorage.getItem('access_token') || localStorage.getItem('token');
            
            if (!token) {
                console.warn('⚠️ Token não encontrado');
                alert('Você precisa estar logado');
                window.location.href = '/login?redirect=/meus-veiculos';
                return;
            }

            console.log('🔑 Token encontrado:', token.substring(0, 20) + '...');

            try {
                const response = await fetch('https://kaido-house.onrender.com/meus-veiculos', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('📊 Status da resposta:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ Veículos carregados:', data);
                    exibirVeiculos(data.veiculos);
                } else if (response.status === 401) {
                    console.error('❌ Token inválido ou expirado');
                    // Limpar AMBOS os tokens
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('token');
                    alert('Sessão expirada. Faça login novamente.');
                    window.location.href = '/login?redirect=/meus-veiculos';
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('❌ Erro da API:', errorData);
                    document.getElementById('listaVeiculos').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h2>Erro ao carregar veículos</h2>
                            <p>${errorData.message || 'Tente novamente mais tarde'}</p>
                            <button onclick="carregarVeiculos()" class="btn-cadastrar">
                                <i class="fas fa-redo"></i> Tentar Novamente
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Erro de conexão:', error);
                document.getElementById('listaVeiculos').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>Erro de conexão</h2>
                        <p>Verifique sua internet e tente novamente</p>
                        <button onclick="carregarVeiculos()" class="btn-cadastrar">
                            <i class="fas fa-redo"></i> Tentar Novamente
                        </button>
                    </div>
                `;
            }
        }
        
        function exibirVeiculos(veiculos) {
            const container = document.getElementById('listaVeiculos');
            
            if (!veiculos || veiculos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-car"></i>
                        <h2>Nenhum veículo cadastrado</h2>
                        <p>Você ainda não cadastrou nenhum veículo para venda.</p>
                        <a href="/perfil" class="btn-cadastrar">
                            <i class="fas fa-plus-circle"></i> Cadastrar Primeiro Veículo
                        </a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = veiculos.map(v => {
                const estadoClass = `estado-${v.estado.toLowerCase()}`;
                const preco = parseFloat(v.preco).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const km = parseInt(v.km).toLocaleString('pt-BR');
                
                // Se tiver fotos, usar a primeira, senão mostrar ícone
                const imagemHTML = v.fotos && v.fotos.length > 0 
                    ? `<img src="${v.fotos[0]}" alt="${v.marca} ${v.modelo}">`
                    : `<i class="fas fa-car"></i>`;
                
                return `
                    <div class="veiculo-card">
                        <div class="veiculo-image">
                            ${imagemHTML}
                        </div>
                        <div class="veiculo-info">
                            <h3>${v.marca} ${v.modelo}</h3>
                            <span class="veiculo-estado ${estadoClass}">${v.estado}</span>
                            
                            <div class="veiculo-details">
                                <p><i class="fas fa-calendar"></i> Ano: ${v.ano}</p>
                                <p><i class="fas fa-tachometer-alt"></i> KM: ${km}</p>
                                <p><i class="fas fa-palette"></i> Cor: ${v.cor}</p>
                            </div>
                            
                            <div class="veiculo-price">${preco}</div>
                            
                            <div class="veiculo-actions">
                                <button class="btn-edit" onclick="editarVeiculo('${v.id}')">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button class="btn-delete" onclick="deletarVeiculo('${v.id}', '${v.marca} ${v.modelo}')">
                                    <i class="fas fa-trash"></i> Deletar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function deletarVeiculo(id, nome) {
            if (!confirm(`Deseja realmente deletar o veículo "${nome}"?\n\nEsta ação não pode ser desfeita.`)) {
                return;
            }
            
            // ✅ CORREÇÃO: Mesma ordem de verificação
            const token = localStorage.getItem('access_token') || localStorage.getItem('token');
            
            if (!token) {
                alert('Você precisa estar logado');
                window.location.href = '/login?redirect=/meus-veiculos';
                return;
            }
            
            try {
                const response = await fetch(`https://kaido-house.onrender.com/deletar-veiculo/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    alert('Veículo deletado com sucesso!');
                    carregarVeiculos(); // Recarregar lista
                } else if (response.status === 401) {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('token');
                    alert('Sessão expirada. Faça login novamente.');
                    window.location.href = '/login?redirect=/meus-veiculos';
                } else if (response.status === 403) {
                    alert('Você não tem permissão para deletar este veículo');
                } else if (response.status === 404) {
                    alert('Veículo não encontrado');
                } else {
                    const error = await response.json().catch(() => ({}));
                    alert(`Erro: ${error.error || 'Erro ao deletar veículo'}`);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao deletar veículo. Tente novamente.');
            }
        }
        
        function editarVeiculo(id) {
            // Funcionalidade de edição - redirecionar para página de edição ou abrir modal
            alert('Funcionalidade de edição em desenvolvimento.\n\nEm breve você poderá editar seus veículos!');
            // window.location.href = `/editar-veiculo/${id}`;
        }
        
        // ✅ Carregar veículos ao carregar a página
        document.addEventListener('DOMContentLoaded', carregarVeiculos);
        
        console.log('✅ Script meus_veiculos.html carregado com sucesso!');
    </script>
    
    <script src="/static/js/nav_bar.js"></script>
</body>

</html>
